name: Prospective raw archive integrity negatives
on:
  push:
    branches: [audit/prospective-raw-archive-index-20261025-1632]
  pull_request:
    paths:
      - 'scripts/archive_raw_bodies.py'
      - 'tests/test_archive_raw_bodies.py'
      - 'tests/test_search_v2_run_tar_only.py'
      - '.github/workflows/prospective-raw-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install repository's hashed test dependencies
        run: python -m pip install --require-hashes -r docs/offline/requirements.lock
      - name: Verify raw archive preservation and fail-closed negatives
        run: python -m pytest -q tests/test_archive_raw_bodies.py tests/test_search_v2_run_tar_only.py
