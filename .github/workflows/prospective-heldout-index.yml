name: Prospective held-out staged-index negatives

on:
  pull_request:
    paths:
      - "harness/heldout.py"
      - "tests/test_heldout.py"
      - ".github/workflows/prospective-heldout-index.yml"
  push:
    branches:
      - "audit/prospective-heldout-index-20261025-1433"

permissions:
  contents: read

jobs:
  heldout-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install repository hashed dependency lock
        run: python -m pip install --require-hashes -r docs/offline/requirements.lock
      - name: Test staged-index and existing held-out detector negatives
        run: python -m pytest -q tests/test_heldout.py
