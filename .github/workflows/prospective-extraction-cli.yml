name: Prospective extraction CLI negative checks
on:
  pull_request:
    paths:
      - 'extraction_contract/**'
      - 'tests/test_extraction_contract.py'
      - '.github/workflows/prospective-extraction-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraction-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install same hashed verification dependencies
        run: python -m pip install --require-hashes -r docs/offline/requirements.lock
      - name: Run extraction contract tests (supplemental, not a substitute for full verify)
        run: python -m pytest -q tests/test_extraction_contract.py
