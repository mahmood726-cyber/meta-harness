name: Prospective declaration write-once negatives

on:
  pull_request:
    paths:
      - "harness/prospective.py"
      - "tests/test_prospective.py"
      - ".github/workflows/prospective-declaration-write-once.yml"
  push:
    branches:
      - "audit/prospective-declaration-write-once-20261026"

permissions:
  contents: read

jobs:
  declaration-write-once:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install repository hashed dependency lock
        run: python -m pip install --require-hashes -r docs/offline/requirements.lock
      - name: Exercise prospective batch declaration integrity tests
        run: python -m pytest -q tests/test_prospective.py
