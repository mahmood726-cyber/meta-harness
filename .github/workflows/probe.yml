name: probe-replay-dump
on:
  push:
    branches: [ "probe/ci-replay-dump" ]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - run: python scripts/probe_replay_dump.py spironolactone-hfref-mortality
      - uses: actions/upload-artifact@v4
        with:
          name: replay-dump
          path: probe_out/
