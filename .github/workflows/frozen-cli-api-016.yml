name: Frozen synthetic CLI API parity (CROSS-EXCH-016)

# Supplemental executed two-repository canary. Never replaces verify_all.
on:
  push:
    branches:
      - 'audit/cross-exch-016-*'
  pull_request:
    paths:
      - '.github/workflows/frozen-cli-api-016.yml'
      - 'benchmarks/cross_repo/v0.1/frozen-cli-api-016.json'
      - 'benchmarks/cross_repo/v0.1/frozen_cli_api_handoff_016.py'
      - 'harness/exchange_v01.py'
      - 'benchmarks/cross_repo/v0.1/pinned_pairwise_canary.py'
      - 'tests/test_exchange_cli_api_016.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-cli-api-016:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate orchestration, not counted as frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: governance
          persist-credentials: false
      - name: Checkout exact frozen Meta-Harness importer producer and CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mahmood726-cyber/meta-harness
          ref: ea2fac35a212a330dfe27f7b710347e9ef69a12a
          path: meta
          persist-credentials: false
      - name: Checkout exact frozen actual RapidMeta JS consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mahmood726-cyber/rapidmeta-kit
          ref: 368137dc437543c721b98be39c14282c338f7797
          path: rapidmeta
          persist-credentials: false
      - name: Set Python 3.13.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - name: Set Node 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Execute actual frozen CLI versus API and actual RapidMeta no-pool gates
        run: |
          set -euo pipefail
          python governance/benchmarks/cross_repo/v0.1/frozen_cli_api_handoff_016.py \
            --meta meta --rapidmeta rapidmeta --output handoff-016-evidence
      - name: Independently verify every SHA receipt and refusal without rerunning engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          evidence = Path("handoff-016-evidence")
          registration_raw = Path("governance/benchmarks/cross_repo/v0.1/frozen-cli-api-016.json").read_bytes()
          registration = json.loads(registration_raw)
          index = json.loads((evidence / "index.json").read_bytes())
          assert index["case_id"] == registration["case_id"] == "CROSS-EXCH-016"
          assert registration["registered_status"] == "NOT_RUN"
          assert index["evidence_scope"] == "SYNTHETIC_FROZEN_TWO_REPOSITORY_CLI_API_HANDOFF_ONLY"
          assert index["registration_sha256"] == hashlib.sha256(registration_raw).hexdigest()
          assert index["meta_harness_commit"] == registration["repositories"]["meta-harness"]["commit"]
          assert index["rapidmeta_commit"] == registration["repositories"]["rapidmeta-kit"]["commit"]
          assert index["python_runtime"] == registration["runtime"]["python"]
          assert index["node_runtime"] == "v" + registration["runtime"]["node"]
          assert index["source_sha256"] == registration["frozen_source"]["sha256"]
          assert index["external_R_oracle"] == "NOT_TESTED"
          assert index["four_repo_suite"] == "NOT_RUN"
          expected_files = {"source.txt"}
          for label in registration["scenarios"]:
              expected_files.add(f"inputs/{label}.json")
              expected_files.add(f"results/{label}.json")
          assert set(index["digests"]) == expected_files
          for name, expected in index["digests"].items():
              path = evidence / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          for label, expected in registration["scenarios"].items():
              raw = (evidence / "inputs" / (label + ".json")).read_bytes()
              recorded = json.loads((evidence / "results" / (label + ".json")).read_bytes())
              assert recorded["raw_sha256"] == hashlib.sha256(raw).hexdigest()
              assert recorded["cli_status"] == recorded["api_status"] == expected["importer"]
              consumer = recorded["consumer"]
              assert consumer["status"] == expected["consumer"]
              assert consumer["input_sha256"] == hashlib.sha256(raw).hexdigest()
              if label == "allow_rr_itt":
                  assert consumer["engine_invoked"] is True
                  assert consumer["engine_output"]["k_used"] == 2
                  assert consumer["engine_output"]["measure"] == "RR"
              else:
                  assert consumer["engine_invoked"] is False
                  assert consumer["status"] == "REFUSED"
          tampered = (evidence / "inputs/refuse.json").read_bytes() + b"X"
          assert hashlib.sha256(tampered).hexdigest() != index["digests"]["inputs/refuse.json"]
          print(f"CROSS-EXCH-016: confirmed {len(registration['scenarios'])} real frozen two-repo synthetic cases, {len(expected_files)} exact SHA receipts, fail-closed engine gates")
          PY
      - name: Archive raw evidence even if execution fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-cross-exch-016-${{ github.sha }}
          path: handoff-016-evidence/
          if-no-files-found: error
          retention-days: 90
