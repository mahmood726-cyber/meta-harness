name: verify

# Server-side enforcement of the same invariants the local pre-commit gate checks, so a push from
# any clone (whether or not it has core.hooksPath=.githooks installed) cannot land a page that fails
# tests, does not reproduce, or does not pass the publication gate. This is the reproducibility claim
# made independent of one machine's hook configuration.
#
# ONE STANDARD (2026-09-14): CI and the local hook both run scripts/verify_all.py -- the same limbs in
# the same order. Before this, CI ran no index-currency check (a hand-edited served index passed CI)
# and the hook ran no unit tests; see evidence/gate-authority-2026-09-14/08-*, 09-*.
#
# DEPLOY IS CONDITIONAL ON VERIFY (gate authority, 2026-09-14). Pages used to be built by GitHub's
# automatic "pages build and deployment" from main:/docs on EVERY push, so a SHA whose `verify` run
# failed was still served (109053ad, 2026-09-13: unit tests red, Pages green). The Pages source is now
# "GitHub Actions" and the only deploy path is the `deploy` job below, which `needs: verify`.
#
# BUILD ONCE, VERIFY THAT ARTIFACT, DEPLOY EXACTLY IT, FETCH IT BACK (artifact identity, 2026-09-14,
# evidence/artifact-identity-2026-09-14/). The first gated deploy re-checked-out the commit inside the
# deploy job and tarred a NEW artifact that verify had never seen (01-*). Now: `verify` computes a per-file
# SHA-256 manifest of the tree the standard just passed and uploads the pages artifact FROM THAT TREE;
# `deploy` has NO checkout -- it downloads that artifact, checks every file against the manifest before
# deploying, deploys it, fetches every path from the live site and compares body digests, and publishes
# the whole chain (commit -> verify run -> manifest -> artifact id -> deployment -> served digests) as one
# record on the `production-records` branch. A mismatch anywhere fails the deploy job and is recorded.

on:
  push:
    branches:
      - "**"
      - "!production-records"   # written by the deploy job; carries no site and must not trigger itself
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.pages.outputs.artifact_id }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate + reproduce use `git log`/`git ls-files` (protocol SHA, cache tracking)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest openpyxl  # openpyxl: exercise the optional xlsx-supplement test (importorskip guards its absence)
      - name: The full standard (scripts/verify_all.py -- identical to the local pre-commit hook)
        run: python scripts/verify_all.py
      - name: "Per-file SHA-256 manifest of the tree the standard just passed (binds each page's html_sha256)"
        id: manifest
        run: |
          python scripts/production_record.py manifest --docs docs --out docs/_production/manifest.json
          echo "sha256=$(sha256sum docs/_production/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: "Tooling for the deploy job (it has no checkout): manifest + attestation script"
        uses: actions/upload-artifact@v4
        with:
          name: production-record
          path: |
            docs/_production/manifest.json
            scripts/production_record.py
          retention-days: 90
          if-no-files-found: error
      - name: Pages artifact FROM THE VERIFIED TREE -- the only artifact deploy may consume
        id: pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # The ONLY route to the served site. Runs only for a push to main whose `verify` job succeeded, and
  # consumes the artifact verify uploaded -- there is no checkout and nothing is regenerated here.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read      # download the artifacts of this run
      contents: write    # append the production record to the production-records branch (not main; ruleset-protected)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the manifest + script the verify job produced
        uses: actions/download-artifact@v4
        with:
          name: production-record
          path: pr
      - name: Download the pages artifact the verify job produced (id ${{ needs.verify.outputs.pages_artifact_id }})
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages
      - name: "Verify the artifact about to be deployed == the manifest (every file, per-file SHA-256)"
        run: python3 pr/scripts/production_record.py check-artifact --manifest pr/docs/_production/manifest.json --tar pages/artifact.tar
      - name: Deploy exactly that artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Fetch every path from the live site and prove body digest == verified digest
        id: attest
        continue-on-error: true
        run: |
          python3 pr/scripts/production_record.py attest \
            --manifest pr/docs/_production/manifest.json \
            --base-url "${{ steps.deployment.outputs.page_url }}" \
            --record production-record.json \
            --pages-artifact-id "${{ needs.verify.outputs.pages_artifact_id }}" \
            --environment github-pages --retry-seconds 600
      - name: Keep the record as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-record-${{ github.sha }}
          path: production-record.json
          retention-days: 90
      - name: Publish the record to the production-records branch (durable, anonymously readable)
        if: always()
        run: python3 pr/scripts/production_record.py publish-record --record production-record.json --repo "${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --branch production-records
      - name: Fail the deploy job unless the served bytes were attested
        run: test "${{ steps.attest.outcome }}" = "success"
