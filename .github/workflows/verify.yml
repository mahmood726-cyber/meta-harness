name: verify

# Server-side enforcement of the same invariants the local pre-commit gate checks, so a push from
# any clone (whether or not it has core.hooksPath=.githooks installed) cannot land a page that fails
# tests, does not reproduce, or does not pass the publication gate. This is the reproducibility claim
# made independent of one machine's hook configuration.
#
# DEPLOY IS CONDITIONAL ON VERIFY (gate authority, 2026-09-14). Pages used to be built by GitHub's
# automatic "pages build and deployment" from main:/docs on EVERY push, so a SHA whose `verify` run
# failed was still served (109053ad, 2026-09-13: unit tests red, Pages green). The Pages source is now
# "GitHub Actions" and the only deploy path is the `deploy` job below, which `needs: verify` -- a red
# verify means no deploy, and the previously served version stays up. Nothing else may deploy.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate + reproduce use `git log`/`git ls-files` (protocol SHA, cache tracking)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest openpyxl  # openpyxl: exercise the optional xlsx-supplement test (importorskip guards its absence)
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Offline reproduction (every live page replays byte-for-byte from committed cache)
        run: python scripts/reproduce_review.py
      - name: Publication gate on every live review page
        run: |
          set -e
          fail=0
          for d in docs/reviews/*/; do
            if [ -f "$d/review.json" ]; then
              python -m harness.gate "$d" || fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI: one or more pages failed the publication gate"; exit 1
          fi

  # The ONLY route to the served site. Runs only for a push to main whose `verify` job succeeded.
  # A skipped/failed deploy leaves the last good deployment being served.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
