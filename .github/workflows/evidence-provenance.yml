name: Evidence provenance unit tests
on:
  pull_request:
    paths:
      - 'harness/evidence_provenance.py'
      - 'tests/test_evidence_provenance.py'
      - '.github/workflows/evidence-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused source and refusal tests
        run: python -m unittest discover -s tests -p test_evidence_provenance.py -v
